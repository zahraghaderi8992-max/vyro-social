name: Build VYRO iOS Simulator App

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyro-ios-simulator
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY_IOS }}
          VITE_VYRO_OTP_AUTH_UI_ENABLED: ${{ vars.VITE_VYRO_OTP_AUTH_UI_ENABLED }}
        run: npm run build
      - name: Add iOS platform
        run: npx cap add ios
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Build iOS Simulator app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          cd build/ios/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/vyro-ios-simulator.zip"
      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyro-ios-simulator-app
          path: vyro-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
