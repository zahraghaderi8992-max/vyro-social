name: Build VYRO Windows Desktop App

on:
  push:
    branches: [windows-app]
    paths:
      - 'src/**'
      - 'public/**'
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.js'
      - '.github/workflows/build-windows-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyro-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build VYRO web interface
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Package Windows installer and portable app
        run: npx electron-builder --win nsis portable
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: vyro-windows-${{ github.sha }}
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14
