name: Build VYRO Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyro-windows-installer
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Sync shared VYRO version metadata
        run: npm run version:sync
      - name: Build VYRO desktop installer
        env:
          VITE_SUPABASE_URL: https://vyro-ai-engine.vyro-social.workers.dev/supabase
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY_WINDOWS }}
          VITE_VYRO_OTP_AUTH_UI_ENABLED: ${{ vars.VITE_VYRO_OTP_AUTH_UI_ENABLED }}
        run: npm run desktop:build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: vyro-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
