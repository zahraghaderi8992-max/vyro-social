name: Deploy VYRO isolated preview

on:
  push:
    branches:
      - work/vyro-core-upgrade-2026-11-04
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'index.html'
      - 'vite.config.js'
      - '.github/workflows/deploy-vyro-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vyro-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout working branch for preview
        uses: actions/checkout@v4
        with:
          ref: work/vyro-core-upgrade-2026-11-04
          path: preview-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: production
        run: npm install --no-audit --no-fund

      - name: Build unchanged production site
        working-directory: production
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VYRO_OTP_AUTH_UI_ENABLED: ${{ vars.VITE_VYRO_OTP_AUTH_UI_ENABLED }}
        run: npm run build

      - name: Install preview dependencies
        working-directory: preview-source
        run: npm install --no-audit --no-fund

      - name: Build working branch preview (isolated UI only; no production backend credentials)
        working-directory: preview-source
        run: npm run build

      - name: Place preview under a separate path
        run: |
          mkdir -p production/dist/preview
          cp -a preview-source/dist/. production/dist/preview/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined production and preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
