<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0b" />
    <meta name="description" content="وایرو؛ شبکه اجتماعی نسل تازه" />
    <meta name="application-name" content="VYRO" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./vyro-icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VYRO — وایرو</title>
    <style>
      :root{color-scheme:dark;background:#090a0b}
      html,body{margin:0;min-width:320px;min-height:100%;background:#090a0b;color:#f4f4f0}
      #root{min-height:100dvh}
      .vyro-boot{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:14px;background:radial-gradient(ellipse at 50% 35%,#26220d 0,transparent 45%),#090a0b;font:14px system-ui,sans-serif;color:#e8d45a}
      .vyro-boot-mark{font-size:34px;font-weight:900;letter-spacing:7px;text-shadow:0 0 22px #d9bd3566}
      .vyro-boot-spinner{width:22px;height:22px;border:2px solid #6b602a;border-top-color:#f0d83b;border-radius:50%;animation:vyro-spin .8s linear infinite}
      @keyframes vyro-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.vyro-boot-spinner{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="vyro-boot" role="status" aria-live="polite"><div class="vyro-boot-mark">VYRO</div><div class="vyro-boot-spinner"></div><span>وایرو در حال آماده‌سازی است…</span></div></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
